name: Build AltoTrader Package

on:
  push:
    branches: [ "main", "development" ]  
  pull_request:
    branches: [ "main", "development" ]
  release:
    types: [ created ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .[dev]
      - name: Run tests
        run: |
          pytest -W ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      # DEV-Branch: Version mit "-dev" suffix
      - name: Create .dev package version
        if: github.ref == 'refs/heads/development'
        run: |
          echo "DEV-Build, add '-dev' to package version..."
          sed -i 's/^version = .*/&.dev/' pyproject.toml 

      - name: Build package
        run: |
          python -m build
          ls -la dist/  # Verify build output
      
      - name: Sanitize branch name
        id: sanitize
        run: |
          SANITIZED_NAME=$(echo "${{ github.ref_name }}" | sed 's/[\/:"<>|*?\\]/-/g')
          echo "SANITIZED_NAME=${SANITIZED_NAME}" >> $GITHUB_OUTPUT
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ steps.sanitize.outputs.SANITIZED_NAME }}
          path: dist/
          if-no-files-found: error  # Fail if no files are found