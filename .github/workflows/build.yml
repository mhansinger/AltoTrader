name: Build AltoTrader Package

on:
  push:
    branches: [ "main", "development" ]  
  pull_request:
    branches: [ "main", "development" ]
  release:
    types: [ created ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .[dev]
      - name: Run tests
        run: |
          pytest -W ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      # DEV-Branch: Version mit "-dev" suffix
      - name: Create .dev package version
        if: github.ref == 'refs/heads/development'
        run: |
          echo "DEV-Build, add '-dev' to package version..."
          sed -i 's/^version = .*/&.dev/' pyproject.toml 

      - name: Build package
        run: |
          python -m build
          ls -la dist/  # Verify build output
      
      - name: Set artifact name
        id: set-artifact-name
        run: |
          if [ "${{ github.ref }}" == "refs/heads/development" ]; then
            echo "ARTIFACT_NAME=altotrader.dev" >> $GITHUB_OUTPUT
          else
            echo "ARTIFACT_NAME=altotrader" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error