[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altotrader"
version = "0.1.0"
authors = [{ name = "mhansinger" }]
description = "Algorithmic trading package for Kraken"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 2 - Beta",
    "Intended Audience :: Crypto",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "krakenex==2.2.2",
    "pandas==2.2.3",
    "numpy==2.2.6",
    "requests==2.33.0",
    "influxdb-client==1.48.0",
    "pyyaml==6.0.2",
    "pyarrow==19.0.1",
    "websocket-client==1.8.0",
    "python-binance>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ipython", "black", "build"]
dashboard = ["streamlit>=1.30", "plotly>=5.0"]
